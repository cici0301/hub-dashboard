<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>项目汇总看板</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f0f2f5; color:#1a1a2e; }
.header { background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460); color:#fff; padding:18px 28px; text-align:center; }
.header h1 { font-size:22px; }
.container { max-width:1100px; margin:0 auto; padding:16px; }
.kpi-row { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin-bottom:20px; }
.kpi-card { background:#fff; border-radius:8px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.05); border-left:3px solid #ccc; text-align:center; }
.c1 { border-left-color:#4e79a7; } .c1 .v { color:#4e79a7; }
.c2 { border-left-color:#59a14f; } .c2 .v { color:#59a14f; }
.c3 { border-left-color:#f28e2b; } .c3 .v { color:#f28e2b; }
.c4 { border-left-color:#e15759; } .c4 .v { color:#e15759; }
.c5 { border-left-color:#76b7b2; } .c5 .v { color:#76b7b2; }
.c6 { border-left-color:#b07aa1; } .c6 .v { color:#b07aa1; }
.kpi-card .l { font-size:11px; color:#888; margin-bottom:4px; }
.kpi-card .v { font-size:24px; font-weight:700; }
.projects { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
.pcard { background:#fff; border-radius:8px; padding:16px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.05); cursor:pointer; transition:all .2s; text-decoration:none; color:inherit; display:block; }
.pcard:hover { transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.1); }
.pcard.p1 { border-top:3px solid #4e79a7; }
.pcard.p2 { border-top:3px solid #59a14f; }
.pcard.p3 { border-top:3px solid #b07aa1; }
.pcard.p4 { border-top:3px solid #e15759; }
.pcard.p5 { border-top:3px solid #76b7b2; }
.pcard.p6 { border-top:3px solid #f28e2b; }
.pcard.p7 { border-top:3px solid #edc948; }
.pcard.p8 { border-top:3px solid #9c755f; }
.pcard.p9 { border-top:3px solid #bab0ab; }
.pcard.p10 { border-top:3px solid #af7aa1; }
.pcard.p11 { border-top:3px solid #ff9da7; }
.pcard.p12 { border-top:3px solid #86bcb6; }
.pcard h3 { font-size:15px; margin-bottom:8px; }
.pcard .num { font-size:18px; font-weight:700; color:#1a1a2e; }
.pcard .meta { font-size:11px; color:#999; margin-top:4px; }
/* Donut chart */
.donut-section { display:flex; align-items:center; justify-content:center; gap:40px; background:#fff; border-radius:8px; padding:24px; box-shadow:0 1px 3px rgba(0,0,0,.05); margin-bottom:20px; flex-wrap:wrap; }
.donut-wrap { text-align:center; }
.donut { width:200px; height:200px; border-radius:50%; position:relative; margin:0 auto; background:conic-gradient(#4e79a7 0.0deg 263.3deg,#59a14f 263.3deg 314.4deg,#b07aa1 314.4deg 335.8deg,#e15759 335.8deg 343.5deg,#76b7b2 343.5deg 360.0deg); }
.donut-center { position:absolute; top:30%; left:30%; width:40%; height:40%; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-direction:column; }
.donut-center .big { font-size:22px; font-weight:700; color:#1a1a2e; }
.donut-center .small { font-size:10px; color:#999; }
.donut-title { font-size:13px; color:#333; font-weight:600; margin-bottom:12px; }
.legend-list { display:flex; flex-direction:column; gap:8px; }
.li { display:flex; align-items:center; gap:8px; font-size:12px; }
.ld { width:12px; height:12px; border-radius:3px; flex-shrink:0; }
.ln { font-weight:600; min-width:80px; }
.lv { color:#666; }
.ft { text-align:center; color:#bbb; font-size:10px; margin-top:12px; }
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr)}.projects{grid-template-columns:repeat(3,1fr)}.donut-section{flex-direction:column}}
@media(max-width:600px){.projects{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header"><h1>📊 项目汇总看板</h1></div>
<div class="container">
<div class="kpi-row">

></div><span class="ln">老铺黄金</span><span class="lv">$597 (1%)</span></div><div class="li"><div class="ld" style="background:#86bcb6"></div><span class="ln">海信投影仪</span><span class="lv">$1,270 (2%)</span></div></div></div>
<div class="projects" id="projects"></div>
<div class="ft">更新时间: <span id="ut"></span></div>
</div>

<script>
var D = {"total":{"submitted":1066,"confirmed":132,"client":195400,"profit":56356,"published":128150,"profitRate":29},"projects":[{"name":"PolyBuzz","submitted":280,"confirmed":53,"executionOnly":false,"client":75050,"profit":21699,"published":66750,"url":"https://cici0301.github.io/polybuzz-dashboard/"},{"name":"Gauth","submitted":0,"confirmed":28,"executionOnly":true,"client":30900,"profit":10674,"published":30900,"url":"https://cici0301.github.io/gauth-dashboard/"},{"name":"Xteink","submitted":191,"confirmed":22,"executionOnly":false,"client":42350,"profit":10879,"published":1700,"url":"https://cici0301.github.io/xteink-dashboard/"},{"name":"Stacees","submitted":93,"confirmed":13,"executionOnly":false,"client":22300,"profit":5910,"published":20700,"url":"https://cici0301.github.io/stacees-dashboard/"},{"name":"Seasoul","submitted":35,"confirmed":5,"executionOnly":false,"client":5450,"profit":1709.4,"published":0,"url":"https://thothstars.feishu.cn/wiki/N39SwIUT3i5IiQkTV01c8glBnTc?sheet=AMURSx"},{"name":"WASADO","submitted":53,"confirmed":1,"executionOnly":false,"client":750,"profit":270,"published":0,"url":"https://thothstars.feishu.cn/wiki/AAyUwNz5SiyhTokjODhc80DIn18?sheet=ca1e3f"},{"name":"TCL","submitted":36,"confirmed":1,"executionOnly":false,"client":2800,"profit":597.6,"published":2800,"url":"https://thothstars.feishu.cn/wiki/PyYOwZDE9iOp80kP9xIcutQ8ncf?sheet=0aWCbz"},{"name":"Pippit","submitted":122,"confirmed":6,"executionOnly":false,"client":9500,"profit":2450,"published":0,"url":"https://thothstars.feishu.cn/wiki/RUoLwChroijlWbkMLercQNbcntf"},{"name":"DJI Pocket","submitted":104,"confirmed":1,"executionOnly":false,"client":1000,"profit":300,"published":0,"url":"https://thothstars.feishu.cn/wiki/NS4zw4WTOiMwRwkXKDgclNlnnSf"},{"name":"TEMU","submitted":15,"confirmed":0,"executionOnly":false,"client":0,"profit":0,"published":null,"url":"https://cici0301.github.io/temu-dashboard/"},{"name":"老铺黄金","submitted":124,"confirmed":1,"executionOnly":false,"client": document.getElementById("k3").textContent = "$" + D.total.profit.toLocaleString();
document.getElementById("k4").textContent = D.total.profitRate + "%";
document.getElementById("k5").textContent = "$" + D.total.published.toLocaleString();

(function(){
  var container = document.getElementById("projects");
  D.projects.forEach(function(p, i){
    var card = document.createElement("a");
    card.className = "pcard p" + (i + 1);
    card.href = p.url;
    card.target = "_blank";
    var title = document.createElement("h3");
    title.textContent = p.name;
    card.appendChild(title);
    var num = document.createElement("div");
    num.className = "num";
    num.textContent = p.executionOnly ? p.confirmed + " 合作" : p.confirmed + " 确认 / " + p.submitted + " 提报";
    card.appendChild(num);
    var meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = "对客 $" + p.client.toLocaleString() + " | 利润 $" + p.profit.toLocaleString();
    card.appendChild(meta);
    var published = document.createElement("div");
    published.className = "meta";
    published.textContent = "已发布金额 " + (p.published === null ? "暂不统计" : "$" + p.published.toLocaleString());
    card.appendChild(published);
    var more = document.createElement("div");
    more.className = "meta";
    more.style.marginTop = "4px";
    more.style.color = "#4e79a7";
    more.textContent = "点击进入 →";
    card.appendChild(more);
    container.appendChild(card);
  });
})();

document.getElementById("ut").textContent = new Date().toLocaleString("zh-CN");
</script>
</body>
</html>
